---
- name: Deploy MarketplacesGoodsTracker
  hosts: server
  become: true
  vars:
    project_path: /root/MarketplacesGoodsTracker
    repo_url: https://github.com/TimNekk/MarketplacesGoodsTracker
    git_version: main
    start_immediately: false
    dotenv_content: "{{ lookup('ansible.builtin.env', 'DOTENV_CONTENT') | default('') }}"
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Pull latest code
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: "{{ git_version }}"
        force: true

    - name: Write .env from DOTENV_CONTENT
      ansible.builtin.copy:
        content: "{{ dotenv_content }}"
        dest: "{{ project_path }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: dotenv_content | length > 0

    - name: Check that .env exists
      ansible.builtin.stat:
        path: "{{ project_path }}/.env"
      register: env_file
      when: dotenv_content | length == 0

    - name: Fail if .env is missing
      ansible.builtin.fail:
        msg: "No DOTENV_CONTENT provided and {{ project_path }}/.env does not exist (see .env.dist)"
      when: dotenv_content | length == 0 and not env_file.stat.exists

    - name: Set Ozon run flags
      ansible.builtin.lineinfile:
        path: "{{ project_path }}/.env"
        regexp: "^RUN_FLAGS="
        line: "RUN_FLAGS={{ '-u' if start_immediately | bool else '' }}"
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Ensure data directory exists and is writable by the container user
      ansible.builtin.file:
        path: "{{ project_path }}/data"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Check that the Ozon browser profile is present
      ansible.builtin.stat:
        path: "{{ project_path }}/data/ozon_profile"
      register: ozon_profile

    - name: Warn if the Ozon browser profile is missing
      ansible.builtin.debug:
        msg: >-
          No Ozon profile at {{ project_path }}/data/ozon_profile.
          Run scripts/ozon_login.py locally and rsync data/ to the server,
          otherwise parsing returns errors instead of authenticated prices.
      when: not ozon_profile.stat.exists

    - name: Build and restart compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_path }}"
        state: present
        build: always
        remove_orphans: true
        services:
          - ozon
