---
- name: Deploy MarketplacesGoodsTracker
  hosts: server
  become: true
  vars:
    project_path: /root/MarketplacesGoodsTracker
    repo_url: https://github.com/TimNekk/MarketplacesGoodsTracker
    git_version: main
    start_ozon_immediately: false
    start_wildberries_immediately: false
    dotenv_content: "{{ lookup('ansible.builtin.env', 'DOTENV_CONTENT') | default('') }}"
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Pull latest code
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: "{{ git_version }}"
        force: true

    - name: Write .env from DOTENV_CONTENT
      ansible.builtin.copy:
        content: "{{ dotenv_content }}"
        dest: "{{ project_path }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: dotenv_content | length > 0

    - name: Check that .env exists
      ansible.builtin.stat:
        path: "{{ project_path }}/.env"
      register: env_file
      when: dotenv_content | length == 0

    - name: Fail if .env is missing
      ansible.builtin.fail:
        msg: "No DOTENV_CONTENT provided and {{ project_path }}/.env does not exist (see .env.dist)"
      when: dotenv_content | length == 0 and not env_file.stat.exists

    - name: Set Ozon run flags
      ansible.builtin.lineinfile:
        path: "{{ project_path }}/.env"
        regexp: "^OZON_RUN_FLAGS="
        line: "OZON_RUN_FLAGS={{ '-u' if start_ozon_immediately | bool else '' }}"
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Set Wildberries run flags
      ansible.builtin.lineinfile:
        path: "{{ project_path }}/.env"
        regexp: "^WILDBERRIES_RUN_FLAGS="
        line: "WILDBERRIES_RUN_FLAGS={{ '-u' if start_wildberries_immediately | bool else '' }}"
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Deploy Ozon service
      block:
        - name: Build and restart Ozon
          community.docker.docker_compose_v2:
            project_src: "{{ project_path }}"
            state: present
            build: always
            services:
              - ozon
      rescue:
        - name: Record Ozon deploy failure
          ansible.builtin.set_fact:
            ozon_failed: true
        - name: Warn about Ozon deploy failure
          ansible.builtin.debug:
            msg: "Ozon deploy failed, continuing to Wildberries"

    - name: Deploy Wildberries service
      block:
        - name: Build and restart Wildberries
          community.docker.docker_compose_v2:
            project_src: "{{ project_path }}"
            state: present
            build: always
            services:
              - wildberries
      rescue:
        - name: Record Wildberries deploy failure
          ansible.builtin.set_fact:
            wildberries_failed: true
        - name: Warn about Wildberries deploy failure
          ansible.builtin.debug:
            msg: "Wildberries deploy failed"

    - name: Fail if any service failed to deploy
      vars:
        failed_services: "{{ (['ozon'] if ozon_failed | default(false) else []) + (['wildberries'] if wildberries_failed | default(false) else []) }}"
      ansible.builtin.fail:
        msg: "Deploy failed for: {{ failed_services | join(', ') }}"
      when: failed_services | length > 0
