name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  check:
    name: Dry run (--check --diff)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible

      - name: Set up deploy SSH access
        uses: ./.github/actions/deploy-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER || 'root' }}

      - name: Dry run playbook
        working-directory: ansible
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
        run: ansible-playbook deploy.yaml --check --diff --extra-vars "git_version=${{ github.sha }}"
