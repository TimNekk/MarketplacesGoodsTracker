name: Lint

on:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible
        with:
          install-lint: "true"

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint
