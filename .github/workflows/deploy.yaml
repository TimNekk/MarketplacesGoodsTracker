name: Deploy

on:
  workflow_dispatch:
    inputs:
      start_ozon_immediately:
        description: Start Ozon parsing immediately instead of waiting for schedule
        type: boolean
        default: false
      start_wildberries_immediately:
        description: Start Wildberries parsing immediately instead of waiting for schedule
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-target
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible

      - name: Set up deploy SSH access
        uses: ./.github/actions/deploy-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER || 'root' }}

      - name: Apply playbook
        working-directory: ansible
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
        run: |
          ansible-playbook deploy.yaml --diff --extra-vars \
            "git_version=${{ github.sha }} start_ozon_immediately=${{ inputs.start_ozon_immediately == true }} start_wildberries_immediately=${{ inputs.start_wildberries_immediately == true }}"
